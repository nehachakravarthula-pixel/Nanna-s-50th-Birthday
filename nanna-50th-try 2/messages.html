<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Messages · 50 Years of You</title>

<style>
:root{
  --navy:#24324a;
  --navy2:#35435c;
  --ivory:#fbf6ee;
  --cream:#fffaf3;
  --gold:#c79552;
  --peach:#e9b39b;
  --rose:#c97970;
  --ink:#3a3440;
  --muted:#756f70;
  --white:#fff
}

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  font-family:"DM Sans",sans-serif;
  color:var(--ink);
  background:var(--ivory)
}

body{overflow-x:hidden}

nav{
  height:68px;
  background:rgba(36,50,74,.98);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 clamp(20px,5vw,80px)
}

.brand{
  font-family:"Playfair Display";
  font-size:20px
}

.links{
  display:flex;
  gap:28px
}

.links a{
  color:#fff;
  text-decoration:none;
  font-size:14px
}

.links a:hover{
  color:#f0cfae
}

.page{
  min-height:calc(100vh - 68px);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:28px 5vw
}

.messages-page{
  background:#efe3d5;
  align-items:flex-start;
  padding-top:42px
}

.messages-inner{
  width:min(1150px,100%)
}

.section-head{
  text-align:center;
  max-width:700px;
  margin:0 auto 28px
}

.section-head h1{
  font-family:"Playfair Display";
  font-size:clamp(42px,5vw,64px);
  margin:0;
  color:var(--ink)
}

.section-head p{
  color:var(--muted);
  line-height:1.6
}

/* MESSAGE GRID */

.message-wall{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
  align-items:start
}

/* MESSAGE CARD */

.card{
  background:var(--cream);
  color:var(--ink);
  border:1px solid #ead9c9;
  padding:24px;
  border-radius:18px;
  min-height:175px;
  box-shadow:0 12px 30px rgba(88,65,52,.12);
  cursor:pointer;
  transition:.2s;
  overflow:hidden
}

.card:hover{
  transform:translateY(-5px) rotate(0deg)
}

.card:nth-child(3n+1){
  transform:rotate(-1deg)
}

.card:nth-child(3n+2){
  transform:rotate(1.1deg)
}

.card:nth-child(3n){
  transform:rotate(-.5deg)
}

.card img{
  width:100%;
  height:125px;
  object-fit:cover;
  border-radius:12px;
  margin-bottom:14px;
  display:block
}

/*
  THIS IS THE IMPORTANT CHANGE:
  Long messages are limited inside the card.
*/

.msg{
  font-family:"Playfair Display";
  font-size:19px;
  line-height:1.5;

  display:-webkit-box;
  -webkit-box-orient:vertical;
  -webkit-line-clamp:5;
  overflow:hidden
}

.read-more{
  margin-top:10px;
  font-family:"DM Sans",sans-serif;
  font-size:12px;
  font-weight:700;
  color:#a0834b;
  letter-spacing:.02em
}

.from{
  margin-top:16px;
  color:#6d6b65;
  font-size:13px;
  font-weight:600
}

.empty{
  text-align:center;
  color:#756f70;
  grid-column:1/-1;
  padding:40px
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  background:rgba(3,12,25,.72);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:50
}

.modal.show{
  display:flex
}

.modal-box{
  width:min(650px,100%);
  max-height:90vh;
  overflow:auto;
  background:var(--cream);
  border-radius:22px;
  padding:32px;
  color:var(--ink);
  position:relative;
  box-shadow:0 25px 70px rgba(0,0,0,.3)
}

.close{
  position:absolute;
  right:16px;
  top:16px;
  border:0;
  background:#eadfd4;
  border-radius:50%;
  width:36px;
  height:36px;
  cursor:pointer;
  font-size:20px
}

.full-message{
  font-family:"Playfair Display";
  font-size:27px;
  line-height:1.55;
  white-space:pre-wrap;
  padding-right:10px
}

.full-message-from{
  margin-top:22px;
  font-weight:600
}

/* MOBILE */

@media(max-width:850px){
  .message-wall{
    grid-template-columns:repeat(2,1fr)
  }
}

@media(max-width:600px){

  nav{
    min-height:62px;
    height:auto;
    padding:10px 14px;
    gap:7px;
    flex-wrap:wrap;
    justify-content:center
  }

  .brand{
    font-size:17px;
    white-space:nowrap
  }

  .links{
    gap:8px;
    flex-wrap:wrap;
    justify-content:center
  }

  .links a{
    font-size:12px;
    white-space:nowrap
  }

  .page{
    min-height:calc(100vh - 62px);
    padding:18px 12px
  }

  .messages-page{
    padding:24px 14px
  }

  .section-head h1{
    font-size:40px;
    line-height:1
  }

  .section-head p{
    font-size:14px
  }

  .message-wall{
    grid-template-columns:1fr;
    gap:15px
  }

  .card{
    padding:20px;
    min-height:150px
  }

  .msg{
    font-size:18px;
    -webkit-line-clamp:5
  }

  .modal{
    padding:12px
  }

  .modal-box{
    max-height:92svh;
    padding:26px 20px
  }

  .full-message{
    font-size:23px;
    line-height:1.5
  }

  .close{
    right:10px;
    top:10px
  }
}
</style>
</head>

<body>

<nav>
  <div class="brand">50 Years of You</div>

  <div class="links">
    <a href="index.html">Home</a>
    <a href="write.html">Send a Message</a>
    <a href="messages.html">Messages</a>
  </div>
</nav>

<main class="page messages-page">

  <div class="messages-inner">

    <div class="section-head">
      <div class="eyebrow">From everyone who loves you</div>

      <h1>Birthday Messages</h1>

      <p>Click any card to read the full message.</p>
    </div>

    <div class="message-wall" id="wall">
      <div class="empty">Loading messages…</div>
    </div>

  </div>

</main>

<!-- FULL MESSAGE POPUP -->

<div class="modal" id="viewModal">

  <div class="modal-box">

    <button class="close" onclick="closeModal()">×</button>

    <div id="viewContent"></div>

  </div>

</div>

<script>

const SUPABASE_URL="https://yhgmtvcaptgvmqnczeuc.supabase.co";

const SUPABASE_ANON_KEY="sb_publishable_DUCqevIEFnRrJL4UuwiUoQ_wRYgIYD0";

let sb=null;


/* CONNECT TO SUPABASE */

async function initSite(){

  if(SUPABASE_URL.startsWith("YOUR_")){
    loadDemo();
    return
  }

  const {createClient}=await import(
    "https://esm.sh/@supabase/supabase-js@2"
  );

  sb=createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

  if(document.getElementById("wall")){

    await loadMessages();

    sb.channel("messages-live")
      .on(
        "postgres_changes",
        {
          event:"*",
          schema:"public",
          table:"messages"
        },
        loadMessages
      )
      .subscribe();

  }

}


/* DEMO MODE */

function loadDemo(){

  if(document.getElementById("wall")){

    const demo=[
      [
        "A very happy 50th! Wishing you endless happiness, laughter and wonderful memories.",
        "Family"
      ],
      [
        "Cheers to five decades of being absolutely wonderful. Here’s to many more adventures.",
        "A Friend"
      ],
      [
        "Happy birthday! Thank you for all the love, stories and laughter you’ve given us.",
        "With love"
      ]
    ];

    renderMessages(
      demo.map((x,i)=>({
        id:i,
        name:x[1],
        message:x[0],
        photo_url:null
      }))
    );

  }

}


/* LOAD MESSAGES */

async function loadMessages(){

  if(!sb)return;

  const {data,error}=await sb
    .from("messages")
    .select("*")
    .eq("visible",true)
    .order("created_at",{ascending:false});

  if(!error){

    renderMessages(data || []);

  }else{

    document.getElementById("wall").innerHTML=
      '<div class="empty">Could not load messages. Please refresh and try again.</div>';

    console.error(error);

  }

}


/* ESCAPE HTML */

function escapeHtml(s){

  return String(s).replace(
    /[&<>"']/g,
    c=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[c])
  );

}


/* CREATE MESSAGE CARDS */

function renderMessages(data){

  const wall=document.getElementById("wall");

  if(!wall)return;

  if(!data.length){

    wall.innerHTML=
      '<div class="empty">Be the first to leave a birthday wish.</div>';

    return;

  }

  wall.innerHTML=data.map(m=>{

    const message=String(m.message || "");

    /*
      Only show "Read full message" when
      the message is actually long.
    */

    const isLong=message.length>260;

    return `

      <article
        class="card"
        onclick='openMessage(${JSON.stringify(m).replaceAll("'","&#39;")})'
      >

        ${
          m.photo_url
          ?
          `<img src="${escapeHtml(m.photo_url)}" alt="Birthday photo">`
          :
          ""
        }

        <div class="msg">
          ${escapeHtml(message)}
        </div>

        ${
          isLong
          ?
          `<div class="read-more">Read full message →</div>`
          :
          ""
        }

        <div class="from">
          — ${escapeHtml(m.name)}
        </div>

      </article>

    `;

  }).join("");

}


/* OPEN FULL MESSAGE */

function openMessage(m){

  document.getElementById("viewContent").innerHTML=`

    ${
      m.photo_url
      ?
      `<img
        src="${escapeHtml(m.photo_url)}"
        style="width:100%;max-height:360px;object-fit:cover;border-radius:14px;margin-bottom:22px"
        alt="Birthday photo"
      >`
      :
      ""
    }

    <div
      class="eyebrow"
      style="color:#a0834b"
    >
      A birthday wish
    </div>

    <div class="full-message">
      ${escapeHtml(m.message)}
    </div>

    <div class="full-message-from">
      — ${escapeHtml(m.name)}
    </div>

  `;

  document
    .getElementById("viewModal")
    .classList.add("show");

}


/* CLOSE POPUP */

function closeModal(){

  document
    .getElementById("viewModal")
    .classList.remove("show");

}


/* CLOSE IF CLICKING OUTSIDE */

document.getElementById("viewModal").addEventListener(
  "click",
  function(e){

    if(e.target===this){
      closeModal();
    }

  }
);


/* START */

if(document.readyState==="loading"){

  document.addEventListener(
    "DOMContentLoaded",
    initSite
  );

}else{

  initSite();

}

</script>

</body>
</html>
